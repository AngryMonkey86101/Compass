# Сервер групп: тесты и сборка Docker-образа на каждый пуш в server/.
# Выкладка на VPS — только если в Settings → Secrets → Actions заданы:
#   SERVER_HOST      — IP или домен сервера
#   SERVER_USER      — пользователь SSH (с правом запускать docker)
#   SERVER_SSH_KEY   — закрытый SSH-ключ для этого пользователя
#   SERVER_KNOWN_HOSTS — строка из `ssh-keyscan <сервер>` (защита от подмены сервера)
# Без секретов шаг выкладки пропускается, а не падает.
name: Server

on:
  push:
    branches: [claude/android-capacitor, main]
    paths: ['server/**', '.github/workflows/server.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Тесты API
        working-directory: server
        run: npm test
      - name: Сборка Docker-образа
        working-directory: server
        run: docker build -t compass-groups .
      - name: Проверка образа
        run: |
          docker run -d --name groups -p 8080:8080 compass-groups
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/api/v1/health && exit 0; sleep 1; done
          docker logs groups; exit 1
      - name: Проверка docker compose
        working-directory: server
        run: DOMAIN=compass-api.example.ru docker compose config -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - uses: actions/checkout@v7
        if: env.SERVER_HOST != ''
      - name: SSH-ключ
        if: env.SERVER_HOST != ''
        env:
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Выкладка
        if: env.SERVER_HOST != ''
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -az --delete --exclude .env --exclude data -e "ssh -i ~/.ssh/id_deploy" \
            server/ "$SERVER_USER@$SERVER_HOST:compass-server/"
          ssh -i ~/.ssh/id_deploy "$SERVER_USER@$SERVER_HOST" \
            'cd compass-server && docker compose up -d --build --remove-orphans && docker image prune -f'
      - name: Выкладка пропущена
        if: env.SERVER_HOST == ''
        run: echo "Секреты SERVER_* не заданы — выкладка на сервер пропущена"
